# Every issue starts from a form (bug.yml, crash.yml), so reports carry the
# system and version they happened on. Ideas go to Discussions (Ideas), where people talk them
# over and vote; the issues are kept for problems and the work planned.
blank_issues_enabled: false
contact_links:
  - name: Suggest an idea
    url: https://github.com/mthlpbs/Orbit-Download-Manager/discussions/new?category=ideas
    about: Something MDM should do, or do differently. Ideas are talked over and voted on in Discussions.
  - name: Security problem
    url: https://github.com/mthlpbs/Orbit-Download-Manager/security/policy
    about: Report it privately, not as an issue.
  - name: Help and questions
    url: https://github.com/mthlpbs/Orbit-Download-Manager/blob/main/docs/README.md
    about: The Windows user guide, tutorials and troubleshooting.
