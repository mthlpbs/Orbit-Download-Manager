[package]
name = "mdm-app"
description = "Orbit Download Manager, desktop app (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "orbitdownloadmanager"
path = "src/main.rs"

[features]
default = ["browser-connection"]
# The engine's browser-like connection (#668), for sites that refuse MDM's own as a program's.
# Built from BoringSSL’s C sources on the Windows build machine.
browser-connection = ["mdm-engine/browser-connection"]
# Update now's end-to-end tests only, never in a release (see mdm-tools): a test key for a fake
# release (MDM_TEST_UPDATE_KEY), `/show update-now` (Update now in the window `/show updates`
# opens), and MDM_TEST_UPDATE_HOLD (seconds the update waits before it's put in place, to see and
# close the window meanwhile). tools/lab/update runs them.
test-update = ["mdm-tools/test-update"]

[dependencies]
arboard.workspace = true
base64.workspace = true
chrono.workspace = true
craft-atomic.workspace = true
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_extras.workspace = true
skrifa.workspace = true
image.workspace = true
craft-i18n.workspace = true
# orbitdownloadmanager-cli's commands: its launcher runs this program for them (main.rs).
mdm-cli.workspace = true
mdm-engine.workspace = true
mdm-extract.workspace = true
mdm-geo.workspace = true
mdm-ipc.workspace = true
# The remote control (#141): a paired phone adds and controls downloads over the local network.
mdm-remote.workspace = true
mdm-tools.workspace = true
mdm-torrent.workspace = true
open.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
url.workspace = true
percent-encoding.workspace = true
rfd = "0.17.2"
# Options → Remote → Pair a device's QR code of the address (#141; Nayuki's, no dependencies).
qrcodegen = "1.8.0"
# Line breaks between characters keep a letter and its marks together (Thai, Khmer, Indic).
unicode-segmentation = "1.13.3"
# The text MDM hands to the system: isolates made into marks by each letter's direction (#919).
unicode-bidi = "0.3.18"
# Crash and freeze reports: the monitor, minidumps, symbolicated stacks, release logs.
mdm-cnl.workspace = true
mdm-crash.workspace = true
mdm-debrid.workspace = true
tracing.workspace = true
# RSS feeds (rss.rs): reading them (no DTDs), and the rules' regular expressions; both already
# in the tree (resvg's SVG, the engine's dependencies).
roxmltree = "0.20.0"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Windows can draw with Direct3D 12 instead of OpenGL (#89, renderer.rs): eframe's wgpu renderer
# with wgpu's Direct3D 12 backend only (no Vulkan, no GL: OpenGL stays eframe's glow).
eframe = { workspace = true, features = ["wgpu_no_default_features"] }
# Cargo.lock keeps gpu-allocator (wgpu-hal's) on wgpu-hal's windows 0.62: its range allows 0.61 too,
# which win32job uses, and wgpu-hal doesn't build with that one.
wgpu = { version = "30.0", default-features = false, features = ["dx12", "wgsl"] }
raw-window-handle = "0.6"
# Latin, Greek and Cyrillic text drawn by DirectWrite as Windows' classic controls draw it
# (win32.rs `text_rasterizer`): its COM interfaces, which windows-sys doesn't have. The windows
# 0.62 wgpu-hal already builds. DXGI: the graphics drivers' versions, read before Direct3D 12 starts
# (win32.rs `graphics_drivers`, #1205; wgpu-hal builds it too).
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# Windows notification-area icon and system font fallback.
[target.'cfg(windows)'.dependencies.tray-icon]
version = "0.26.1"

[target.'cfg(windows)'.dependencies.egui_system_font_provider]
workspace = true

[target.'cfg(windows)'.build-dependencies]
# Embeds the exe icon and version info (build.rs).
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
# secrets.rs's test that no secret reaches the log.
tracing-subscriber.workspace = true
# The command line's tests (tests/cli_*.rs) download from it.
mdm-labserver.workspace = true

[lints]
workspace = true
